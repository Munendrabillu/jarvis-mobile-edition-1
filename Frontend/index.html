<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020b14">
  <meta name="description" content="JARVIS AI Voice Assistant">
  <title>J.A.R.V.I.S.</title>
  <link rel="stylesheet" href="style.css">
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <div class="scanlines"></div>

  <header class="top">
    <div>
      <div class="logo">J.A.R.V.I.S.</div>
      <div class="sub">PERSONAL AI INTERFACE</div>
    </div>
    <button id="fullscreen" class="small-btn">⛶</button>
  </header>

  <section class="status-grid">
    <div class="status-box">
      <span class="dot"></span>
      <span id="connection">SYSTEM READY</span>
    </div>
    <div class="status-box">
      <span id="voice-status">VOICE OFF</span>
    </div>
    <div class="status-box">
      <span id="clock">00:00:00</span>
    </div>
  </section>

  <main>
    <section class="reactor-area">
      <div class="outer-ring"></div>
      <div class="outer-ring ring2"></div>
      <div class="outer-ring ring3"></div>
      <div id="reactor" class="reactor">
        <div class="inner-ring">
          <div class="core">
            <span id="core-text">J</span>
          </div>
        </div>
      </div>
      <div id="reactor-label">AWAITING COMMAND</div>
    </section>

    <section class="info-grid">
      <div class="info-card">
        <div class="info-title">BATTERY</div>
        <div id="battery">--%</div>
        <div id="battery-status">DEVICE</div>
      </div>
      <div class="info-card">
        <div class="info-title">WEATHER</div>
        <div id="weather">READY</div>
        <div id="weather-status">WEATHER SEARCH</div>
      </div>
      <div class="info-card">
        <div class="info-title">FLASHLIGHT</div>
        <div id="flash-status">OFF</div>
        <button id="flash-btn" class="mini-btn">TOGGLE</button>
      </div>
    </section>

    <section class="quick-grid">
      <button id="weather-btn">☁ WEATHER</button>
      <button id="google-btn">⌕ GOOGLE</button>
      <button id="youtube-btn">▶ YOUTUBE</button>
      <button id="maps-btn">⌖ MAPS</button>
    </section>

    <section class="chat-panel">
      <div class="panel-title">COMMUNICATION LOG</div>
      <div id="chat" class="chat">
        <div class="message bot">
          <span class="tag">JARVIS</span>
          <div>Hello! Systems online. How may I assist you?</div>
        </div>
      </div>
    </section>

    <section class="control-grid">
      <button id="cam-btn">📷 CAMERA</button>
      <button id="mic-btn">🎙 MIC</button>
      <button id="speak-btn">🔊 SPEAK</button>
      <button id="wake-btn">◉ WAKE</button>
      <button id="clear-btn">⌫ CLEAR</button>
      <button id="fullscreen-bottom">⛶ FULLSCREEN</button>
    </section>

    <div class="image-preview" id="image-preview">
      <img id="preview-img" alt="Selected image">
      <button id="remove-image">✕ REMOVE</button>
    </div>

    <section class="input-area">
      <input id="msg" type="text" placeholder="Enter command..." autocomplete="off">
      <button id="send">SEND</button>
    </section>

    <input id="img-input" type="file" accept="image/*" capture="environment" hidden>
  </main>

  <footer>J.A.R.V.I.S. SYSTEMS • AI ONLINE</footer>
  <script src="script.js"></script>
</body>
</html>
